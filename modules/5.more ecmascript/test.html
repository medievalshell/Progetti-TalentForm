<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
     <p id="js-parse"></p>
    <p id="json-object"></p>
    <script>
      let myJSON = '{"name":"John", "age":31, "city":"New York"}';
      let jsonParse = JSON.parse(myJSON);

      console.log(jsonParse);

      document.getElementById("js-parse").innerHTML = jsonParse.age


      let jsonObject = { name: "John", age: 31, city: "New York" };
      let myJSO = JSON.stringify(jsonObject);
      console.log(myJSO)

      document.getElementById("json-object").innerHTML =myJSO;


      const NOME_FILE_JSON = 'json.json'; 
      function caricaEAccediUtenti() {
          fetch(NOME_FILE_JSON)
              .then(response => {
                  if (!response.ok) {
                      throw new Error(`Errore di rete: ${response.status}`);
                  }
                  return response.json(); 
              })
              .then(json => {
                  const listaUtenti = json.utenti; 
                  if (listaUtenti) {
                      console.log('✅ Dati Utenti caricati con successo:');
                      console.log(listaUtenti);
                      listaUtenti.forEach(utente => {
                          console.log(`- ID: ${utente.id}, Nome: ${utente.nome}`);
                      });
                  } else {
                      console.warn("La chiave 'utenti' non è stata trovata nell'oggetto JSON.");
                  }
              })
              .catch(errore => {
                  console.error('❌ Errore durante il caricamento del JSON:', errore);
              });
      }
      caricaEAccediUtenti();
    </script>
  </body>
</html>
