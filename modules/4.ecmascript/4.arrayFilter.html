<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Javascript</title>
  </head>
  <body>
    <script>
      let arr = [1, 3, 6, 8, 11];
      let filtr = arr.filter((number) => number > 7);

      console.log(filtr);
      //Traccia: Trasforma un array di numeri in un array di oggetti {numero: x}.
      let numbers = [1, 2, 3, 4, 5];
      let objects = numbers.map((num) => ({ numero: num }));
      console.log(objects); 
      //Traccia: Trova solo gli utenti maggiorenni da un array di oggetti.
      let users = [
        { name: "Alice", age: 17 },
        { name: "Bob", age: 22 },
        { name: "Charlie", age: 15 },
        { name: "David", age: 19 },
      ];
      let adults = users.filter((user) => user.age >= 18);
      console.log(adults); 
    </script>
  </body>
</html>
