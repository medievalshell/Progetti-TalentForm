<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="logo.png">
  <title>JS Esercizi Live Editor</title>
  <style>
    body {
      font-family: 'Fira Mono', 'Consolas', monospace;
      margin: 0;
      background: #011627;
      color: #d6deeb;
      min-height: 100vh;
    }
    .wic-container {
      max-width: 1200px;
      height: 800px;
      margin: 40px auto 0 auto;
      background: #011221;
      border: 2px solid #1d3b53;
      border-radius: 12px;
      box-shadow: 0 4px 32px #000a;
      padding: 0 0 2em 0;
    }
    .wic-header {
      background: #1e2d40;
      border-radius: 12px 12px 0 0;
      padding: 1.5em 2em 1em 2em;
      border-bottom: 1.5px solid #1d3b53;
      box-shadow: 0 2px 8px #0006;
    }
    .wic-title {
      color: #d6deeb;
      font-size: 2.1em;
      margin: 0;
      font-weight: 600;
      letter-spacing: 1px;
      text-shadow: 0 2px 8px #0008;
    }
    #output {
      background: #011221;
      color: #addb67;
      padding: 1em;
      min-height: 2em;
      margin-top: 1em;
      border-radius: 8px;
      font-family: 'Fira Mono', 'Consolas', monospace;
      font-size: 1.1em;
      border: 1.5px solid #1d3b53;
      box-shadow: 0 1px 8px #0006;
    }
    .wic-console {
      background: #011221;
      color: #addb67;
      font-family: 'Fira Mono', monospace;
      min-height: 60px;
      max-height: 180px;
      overflow: auto;
      border-radius: 8px;
      margin-top: 1.5em;
      padding: 0.5em 1em;
      font-size: 1em;
      border: 1.5px solid #1d3b53;
      box-shadow: 0 1px 8px #0006;
    }
    #monaco-container {
      border: 1.5px solid #1d3b53;
      background: #011221;
      border-radius: 8px;
      margin-bottom: 1em;
      box-shadow: 0 1px 8px #0006;
    }
    .btn-success {
      background: #2d5f6c;
      border: none;
      color: #fff;
    }
    .btn-primary {
      background: #3a49a4;
      border: none;
      color: #fff;
    }
    .btn-warning {
      background: #c792ea;
      border: none;
      color: #011627;
    }
    .btn-outline-light {
      color: #d6deeb;
      border-color: #d6deeb;
    }
    .btn-outline-light:hover {
      background: #d6deeb;
      color: #011627;
    }
    ::-webkit-scrollbar {
      width: 8px;
      background: #011221;
    }
    ::-webkit-scrollbar-thumb {
      background: #1d3b53;
      border-radius: 4px;
    }
    .logo {
      height: 100px;
      position: absolute;
      top: 21px;
      right: 40px;
    }
  </style>
</head>
<body>
  <div class="wic-container">
    <div class="wic-header">
      <div class="d-flex align-items-center justify-content-end p-2" style="background:#1e2d40; border-radius:12px 12px 0 0;" hidden>
        <span class="me-2" style="color:#82aaff;font-size:1.1em;" hidden>Radio in background:</span>
        <button id="radio-toggle" class="btn btn-outline-info btn-sm" style="min-width:80px;" >Play</button>
        <audio id="radio-bg" src="https://stream-152.zeno.fm/rsswgzom9hvvv?zs=i6cnLoTuRfW8SpaTRNVd3w" preload="none" hidden></audio>
      </div>
      <h1 class="wic-title">JS Esercizi Live Editor</h1>
      <img class="logo" src="logo.png" alt="">
    </div>
    <div id="app"></div>
    <div id="console-panel" class="wic-console"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
  <script src="./test.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function() {
      var radio = document.getElementById('radio-bg');
      var btn = document.getElementById('radio-toggle');
      if(radio) radio.volume = 0.02;
      if(btn && radio) {
        let playing = false;
        btn.onclick = function() {
          if (!playing) {
            radio.play();
            btn.textContent = 'Pause';
            playing = true;
          } else {
            radio.pause();
            btn.textContent = 'Play';
            playing = false;
          }
        };
        radio.onended = function() {
          btn.textContent = 'Play';
          playing = false;
        };
        radio.onpause = function() {
          btn.textContent = 'Play';
          playing = false;
        };
        radio.onplay = function() {
          btn.textContent = 'Pause';
          playing = true;
        };
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
